name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run automated tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            mkdir -p coverage
            node --test --experimental-test-coverage \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=lcov --test-reporter-destination=coverage/lcov.info \
              tests
          else
            node --test tests
          fi
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: ignis-swarm-node20
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Check zero inline comments in hooks and scripts
        shell: bash
        run: |
          if grep -rnE '(^|[[:space:]])//' hooks scripts; then
            echo "Found banned inline comments in hooks/ or scripts/"
            exit 1
          fi
